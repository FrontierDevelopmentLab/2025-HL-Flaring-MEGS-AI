# Data Processing Pipeline Configuration
# 
# Modify the paths below to match your system setup.
# All paths should be absolute paths for best results.
# 
# Usage: python process_data_pipeline.py --config this_file.yaml
#

base_data_dir: /mnt/data
euv:
  input_folder: /mnt/data/SDO335
  bad_files_dir: /mnt/data/SDO335BAD
  wavelengths:
  - 335
iti:
  input_folder: /mnt/data/SDO335
  output_folder: /mnt/data/SDO335ITI
  wavelengths:
  - 335
sxr:
  input_dir: na
  output_dir: na
alignment:
  goes_data_dir: na
  aia_processed_dir: na
  output_sxr_a_dir: na
  output_sxr_b_dir: na
  aia_missing_dir: na
processing:
  max_processes: null
  batch_size_multiplier: 4
  min_batch_size: 1
steps:
  # List of steps to run. Available steps: euv_cleaning, iti_processing, sxr_processing, align_data
  # If not specified or empty, all steps will be run
  # Example: [euv_cleaning, iti_processing] to run only EUV cleaning and ITI processing
  run_steps: [euv_cleaning, iti_processing]
