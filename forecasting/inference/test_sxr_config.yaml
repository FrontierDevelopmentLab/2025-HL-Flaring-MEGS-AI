sxr_path: "/mnt/data/SXR"  # Test SXR path

# Analysis configuration
analysis:
  time_period:
    start_time: "2024-02-09 00:00:00"
    end_time: "2024-02-09 23:59:59"
  
  flare_detection:
    threshold_percentile: 99
    min_patches: 1
    max_patches: 25
    simultaneous_flare_threshold: 0.00001
  
